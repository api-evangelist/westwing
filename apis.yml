name: Westwing
description: >-
  Westwing is Europe's number one "Beautiful Living" e-commerce company, present
  in more than 20 European countries. It is a premium one-stop Home & Living
  destination that offers design lovers a carefully curated selection of the best
  design brands alongside its own Westwing Collection, created by an in-house team
  in Munich, spanning furniture, sofas, lighting, beds, rugs, textiles, outdoor
  and home accessories. Westwing (Westwing Group SE) is a publicly listed company
  and was surfaced in the API Evangelist network as a portfolio company of HV
  Capital and Point Nine. It publishes no public developer API; its primary
  machine-facing surface is a root-level /llms.txt policy that governs how LLMs
  and agents may use its catalog and editorial content.
